services:
  ysp-live:
    image: ysp-live:9.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ysp-live
    restart: unless-stopped
    ports:
      - "8770:8767"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - YSP_DATA_DIR=/app/data
      - YSP_ONLY_4K_DEVICE=1
